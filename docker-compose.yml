services:
  postgres:
    image: postgres:16-alpine
    container_name: spendly-postgres
    environment:
      POSTGRES_DB: spendly
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
    ports:
      - "5433:5432"
    volumes:
      - spendly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spendly-postgres-data:
