services:
  postgres:
    image: postgres:16-alpine
    container_name: spendly-postgres
    environment:
      POSTGRES_DB: spendly
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
    ports:
      - "5433:5432"
    volumes:
      - spendly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://spendly:spendly@postgres:5432/spendly?schema=public
      BETTER_AUTH_SECRET: change-this-in-production
      BETTER_AUTH_URL: http://localhost:5050/v1/auth
      CLIENT_ORIGIN: http://localhost:3000
      HOST: 0.0.0.0
      PORT: 5050
      SWAGGER_URL: http://localhost:5050
    command: sh -c "npx prisma migrate deploy && node build/index.js"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:5050"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5050/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  spendly-postgres-data:
